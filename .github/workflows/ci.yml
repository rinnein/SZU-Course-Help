name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Smoke-test OCR engine initialization
        run: python -c "import logic; ready, message = logic.check_ocr_runtime(); assert ready, message"

      - name: Lint
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Check browser scripts
        run: |
          node --check static_dist/login.js
          node --check static_dist/course-app.js

      - name: Run tests
        run: python -m pytest -q
