name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  native-build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-2022
          - platform: macos-arm64
            os: macos-14
          - platform: macos-x64
            os: macos-15-intel
          - platform: linux-x64
            os: ubuntu-22.04

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Linux binary tooling
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes patchelf

      - name: Install runtime and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[build]"

      - name: Build native release package
        run: python scripts/build_release.py

      - name: Upload native package
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: release/*.zip
          if-no-files-found: error
          retention-days: 7

  source-build:
    name: Build source archive
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build source package
        run: python scripts/package_source.py

      - name: Upload source package
        uses: actions/upload-artifact@v7
        with:
          name: release-source
          path: release/*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [native-build, source-build]
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6

      - name: Download release packages
        uses: actions/download-artifact@v5
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --title "SZU Course Help ${GITHUB_REF_NAME}" \
              --notes-file docs/RELEASE_NOTES.md
            for asset in $(gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name | select(. == "SHA256SUMS.txt" or endswith(".sha256"))'); do
              gh release delete-asset "${GITHUB_REF_NAME}" "${asset}" --yes
            done
            gh release upload "${GITHUB_REF_NAME}" \
              release-assets/*.zip \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              release-assets/*.zip \
              --verify-tag \
              --title "SZU Course Help ${GITHUB_REF_NAME}" \
              --notes-file docs/RELEASE_NOTES.md
          fi

      - name: Remove superseded v3.2.1 release
        if: github.ref_name == 'v3.3.0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "v3.2.1" >/dev/null 2>&1; then
            gh release delete "v3.2.1" --yes
          fi
