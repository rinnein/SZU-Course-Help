name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  native-build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-2022
          - platform: macos-arm64
            os: macos-14
          - platform: macos-x64
            os: macos-15-intel
          - platform: linux-x64
            os: ubuntu-22.04

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Linux binary tooling
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes patchelf

      - name: Install runtime and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[build]"

      - name: Build native release package
        run: python scripts/build_release.py

      - name: Upload native package
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            release/*.zip
            release/*.zip.sha256
          if-no-files-found: error
          retention-days: 7

  source-build:
    name: Build source archive
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build source package
        run: python scripts/package_source.py

      - name: Upload source package
        uses: actions/upload-artifact@v4
        with:
          name: release-source
          path: |
            release/*.zip
            release/*.zip.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [native-build, source-build]
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Create aggregate checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum -- *.zip > SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release-assets/*.zip \
            release-assets/*.zip.sha256 \
            release-assets/SHA256SUMS.txt \
            --verify-tag \
            --title "SZU Course Help ${GITHUB_REF_NAME}" \
            --notes-file docs/RELEASE_NOTES.md
